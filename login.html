<!DOCTYPE html>
<html lang="id">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Amora.id</title>
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
  <link href="./Amora.id — Semua Bisa Punya Toko Online_files/css2" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #09090E;
      --accent:       #6B8E5A;
      --accent-light: #8FB87A;
      --accent-border:rgba(107,142,90,0.32);
      --border:        rgba(255,255,255,0.07);
      --text:    #F2F2F5;
      --text-80: rgba(242,242,245,0.8);
      --text-60: rgba(242,242,245,0.6);
      --r-lg: 16px;
      --r-xl: 20px;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    /* Background orbs */
    #page-bg {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; overflow: hidden;
    }
    .pg-orb {
      position: absolute; border-radius: 50%;
      pointer-events: none;
    }
    .pg-orb-1 {
      top: -15%; left: -12%;
      width: 65vw; height: 65vw;
      background: radial-gradient(ellipse, rgba(8,22,55,0.65) 0%, transparent 68%);
      filter: blur(90px);
    }
    .pg-orb-2 {
      top: -8%; right: -8%;
      width: 55vw; height: 55vw;
      background: radial-gradient(ellipse, rgba(25,65,40,0.55) 0%, transparent 68%);
      filter: blur(100px);
    }
    .pg-orb-3 {
      top: 28%; left: 20%;
      width: 70vw; height: 60vw;
      background: radial-gradient(ellipse, rgba(15,40,25,0.4) 0%, transparent 65%);
      filter: blur(120px);
    }
    .pg-orb-4 {
      top: 35%; right: 5%;
      width: 40vw; height: 40vw;
      background: radial-gradient(ellipse, rgba(107,142,90,0.1) 0%, transparent 65%);
      filter: blur(80px);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .logo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 20px;
    }
    .logo-link:hover {
      opacity: 0.8;
    }
    .logo-link img {
      height: 56px;
      width: auto;
      filter: brightness(0) invert(1);
    }

    .login-card {
      width: 100%;
      background: rgba(13, 13, 24, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--r-xl);
      padding: 48px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2),
        0 8px 32px rgba(0, 0, 0, 0.45);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-80);
    }

    .form-group input {
      padding: 11px 16px;
      border-radius: var(--r-lg);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      transition: background 0.2s, border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-border);
    }
    .form-group input::placeholder {
      color: var(--text-60);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      font-size: 0.8125rem;
      color: var(--text-60);
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--r-xl);
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    .btn-primary:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(107, 142, 90, 0.3);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-google {
      width: 100%;
      padding: 11px 16px;
      border-radius: var(--r-xl);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-google:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .terms {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-60);
      line-height: 1.4;
      margin-top: 20px;
    }
    .terms a {
      color: var(--accent-light);
      text-decoration: underline;
      transition: color 0.2s;
    }
    .terms a:hover {
      color: var(--text);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }
      .container {
        gap: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="page-bg">
    <div class="pg-orb pg-orb-1"></div>
    <div class="pg-orb pg-orb-2"></div>
    <div class="pg-orb pg-orb-3"></div>
    <div class="pg-orb pg-orb-4"></div>
  </div>

  <div class="container">
    <a href="amora-landing-v2.html" class="logo-link">
      <img src="./Amora.id — Semua Bisa Punya Toko Online_files/logo.png" alt="Amora.id">
    </a>

    <div class="login-card">
      <form onsubmit="handleEmailLogin(event)">
        <div class="form-group">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@example.com"
            required
          >
        </div>

        <button type="submit" class="btn-primary">
          Lanjutkan dengan Email
        </button>
      </form>

      <div class="divider">atau</div>

      <button class="btn-google" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="currentColor"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"/>
        </svg>
        Google
      </button>

      <div style="text-align: center; margin-top: 20px;">
        <a href="#" style="color: var(--accent-light); font-size: 0.875rem; text-decoration: underline; transition: color 0.2s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--accent-light)'">
          Butuh bantuan?
        </a>
      </div>

      <p class="terms">
        Dengan login, Anda menyetujui <a href="syarat.html">Syarat & Ketentuan</a> dan <a href="privasi.html">Kebijakan Privasi</a>
      </p>
    </div>
  </div>

  <script>
    function handleEmailLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      console.log('Email login:', email);
      // Redirect will be handled by backend
      alert('Magic link akan dikirim ke: ' + email);
    }

    function handleGoogleLogin() {
      console.log('Google login clicked');
      // Google OAuth will be handled by backend
      alert('Redirect ke Google OAuth akan dijalankan');
    }
  </script>
</body>
</html>
